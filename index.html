<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><title>STY Browser</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div id="tabs"></div><button id="newTab" title="新标签页">＋</button><button id="menu" title="菜单">⋮</button></header>
<nav><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><form id="form"><input id="address" placeholder="搜索或输入网址"></form><button id="star">☆</button><button id="home">⌂</button></nav>
<aside id="side" class="hidden"><div class="sideHead"><b id="sideTitle">收藏夹</b><button id="sideClose">×</button></div><div id="sideBody"></div></aside>
<div id="menuPanel" class="menuPanel hidden"><button data-panel="bookmarks">⭐ 收藏夹</button><button data-panel="history">🕘 历史记录</button><button data-panel="downloads">⬇ 下载</button><button id="settings">⚙ 设置</button><button id="devtools">🛠 开发者工具</button></div>
<script src="renderer.js"></script></body></html>
