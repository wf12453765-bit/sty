<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>STY Browser</title><link rel="stylesheet" href="home.css"></head><body><main><div class="logo">STY</div><h1>欢迎使用 STY Browser</h1><form id="search"><input id="q" autofocus placeholder="搜索或输入网址"><button>搜索</button></form><div class="links"><button data-url="https://www.google.com">Google</button><button data-url="https://www.bing.com">Bing</button><button data-url="https://github.com">GitHub</button></div></main><script>document.getElementById("search").onsubmit=e=>{e.preventDefault();location.href="sty-search:"+encodeURIComponent(document.getElementById("q").value)};document.querySelectorAll("[data-url]").forEach(b=>b.onclick=()=>location.href="sty-open:"+b.dataset.url);</script></body></html>
